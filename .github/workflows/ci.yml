name: ci

on:
  push:
    branches: [master, main, server-sim]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12"]
        # The README tells students to install natively on every platform, uv only, no WSL.
        # One run each on the other two keeps that a fact rather than a claim.
        include:
          - os: windows-latest
            python: "3.12"
          - os: macos-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --group dev
      # Style checks report but do not fail the job: the tests below decide whether the code works.
      - run: uv run ruff check .
        continue-on-error: true
      - run: uv run ruff format --check .
        continue-on-error: true
      - run: uv run pytest -q
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
